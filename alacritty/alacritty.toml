[font]
size = 10
builtin_box_drawing = true

[font.normal]
family = "FiraCode Nerd Font Mono"

[font.bold]
family = "FiraCode Nerd Font Mono"

[font.italic]
family = "FiraCode Nerd Font Mono"

[font.bold_italic]
family = "FiraCode Nerd Font Mono"

[window]
opacity = 0.8
blur = true
decorations = "none"

[cursor]
unfocused_hollow = true

[cursor.style]
shape = "Underline"
blinking = "On"

[selection]
save_to_clipboard = true

[scrolling]
history = 10000

[env]
WINIT_UNIX_BACKEND = "wayland"

[keyboard]
bindings = [
  { key = "Return", mods = "Alt", action = "ToggleFullscreen" },
  { key = "/", mods = "Control", chars = "\u001F" },
  { key = "Space", mods = "Control", chars = "\u0000" },
]

# Tokyo Night
